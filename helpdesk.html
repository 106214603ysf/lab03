<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="Book an appointment with the CWA Help Desk">
  <meta name="keywords" content="help desk, appointment, form, CWA">
  <meta name="author" content="Your Name">
  <title>CWA Help Desk Appointment</title>
</head>
<body>
  <a href="http://www.swin.edu.au"><img src="logo.png" alt="Swinburne University of Technology logo"></a>

  <h1>CWA Help Desk Appointment</h1>

  <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
  <p>Check Blackboard for when CWA tutors will be there.</p>

  <form action="https://httpbin.org/post" method="post">

    <fieldset>
      <legend>Student details</legend>
      <p>
        <label for="studentid">Student ID</label>
        <input type="text" id="studentid" name="studentid"
               pattern="\d{7,10}" title="Enter 7 to 10 digits" required="required">
      </p>
      <p>
        <label for="givenname">Given Name</label>
        <input type="text" id="givenname" name="givenname" maxlength="15"
               pattern="[A-Za-z]+" title="Alphabetic characters only (max 15)" required="required">
        <label for="familyname">Family Name</label>
        <input type="text" id="familyname" name="familyname" maxlength="15"
               pattern="[A-Za-z]+" title="Alphabetic characters only (max 15)" required="required">
      </p>
    </fieldset>

    <fieldset>
      <legend>Your unit</legend>
      <p>
        <input type="radio" id="cos10011" name="unit" value="COS10011" required="required">
        <label for="cos10011">COS10011</label>
        <input type="radio" id="cos60004" name="unit" value="COS60004">
        <label for="cos60004">COS60004</label>
        <input type="radio" id="cos60007" name="unit" value="COS60007">
        <label for="cos60007">COS60007</label>
      </p>
      <p>
        <label for="tutor">Your Tutor</label>
        <select id="tutor" name="tutor" required="required">
          <option value="">Please Select</option>
          <option value="alice">Alice Nguyen</option>
          <option value="ben">Ben Carter</option>
          <option value="chloe">Chloe Smith</option>
          <option value="david">David Lee</option>
        </select>
      </p>
    </fieldset>

    <fieldset>
      <legend>Issue</legend>
      <p>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="html">
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="css" checked="checked">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="js" name="issue[]" value="javascript">
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="php">
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="issue[]" value="mysql">
      </p>
      <p>
        <label for="description">Description of Issue</label><br>
        <textarea id="description" name="description" rows="6" cols="40"
    placeholder="Write description of your problem here..."></textarea>
      </p>
    </fieldset>

    <fieldset>
      <legend>Preferred Date/Time</legend>
      <p>
        <label for="date">Date</label>
        <input type="text" id="date" name="date" placeholder="dd/mm/yyyy"
               pattern="\d{2}/\d{2}/\d{4}" title="Format: dd/mm/yyyy" required="required">
      </p>
      <p>
        <label for="time">Time</label>
        <input type="text" id="time" name="time" placeholder="00:00"
               pattern="\d{2}:\d{2}" title="Format: hh:mm" required="required">
      </p>
    </fieldset>

    <p>
      <input type="submit" value="Book">
      <input type="reset" value="Reset form">
    </p>

  </form>
</body>
</html>
